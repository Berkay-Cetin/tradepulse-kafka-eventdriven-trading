apiVersion: v1
kind: ConfigMap
metadata:
  name: tradepulse-config
data:
  KAFKA__BOOTSTRAPSERVERS: "{{ .Values.kafka.bootstrapServers }}"
  CONNECTIONSTRINGS__POSTGRES: "Host={{ .Values.postgres.host }};Port={{ .Values.postgres.port }};Database={{ .Values.postgres.database }};Username={{ .Values.postgres.username }};Password={{ .Values.postgres.password }}"
  CONNECTIONSTRINGS__REDIS: "{{ .Values.redis.host }}:{{ .Values.redis.port }}"