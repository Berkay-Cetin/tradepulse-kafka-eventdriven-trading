apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  labels:
    app: pricing-service
spec:
  replicas: {{ .Values.pricingService.replicas }}
  selector:
    matchLabels:
      app: pricing-service
  template:
    metadata:
      labels:
        app: pricing-service
    spec:
      containers:
        - name: pricing-service
          image: {{ .Values.pricingService.image }}
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: tradepulse-config
          env:
            - name: KAFKA__CONSUMERGROUP
              value: "pricing-group"
            - name: KAFKA__TOPICS__PRICEFEED
              value: "market.price-feed"
            - name: KAFKA__TOPICS__EXECUTIONS
              value: "trade.executions"
            - name: KAFKA__TOPICS__DEADLETTER
              value: "trade.dead-letter"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-service
spec:
  selector:
    app: pricing-service
  ports:
    - port: 8080
      targetPort: 8080